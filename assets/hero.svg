  <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".6" fill="#B8C7F5" opacity=".12"/></pattern>
  <clipPath id="clip"><rect width="1400" height="448" rx="20"/></clipPath>
</defs>
