<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="448" viewBox="0 0 1400 448" role="img" aria-label="Perspective Illusion Studio — three worlds, one camera language">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B1123"/><stop offset=".58" stop-color="#101A31"/><stop offset="1" stop-color="#19162D"/>
  </linearGradient>
