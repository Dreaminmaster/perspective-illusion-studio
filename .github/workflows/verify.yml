name: Verify Perspective Illusion Studio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  skill-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source and demo
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install deterministic dependencies
        run: npm ci
      - name: Validate scene hooks, camera rig, assets and license
        run: npm test
      - name: Report bundled video metadata
        run: |
          test -s examples/shibuya-demo.mp4
          echo "Bundled video bytes: $(wc -c < examples/shibuya-demo.mp4)"
          test -s assets/shibuya-loop.gif
