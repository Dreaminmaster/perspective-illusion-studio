name: Import Night City 2077 example
on:
  push:
    paths:
      - ".github/workflows/import-night-city.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-night-city:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Skill repository
        uses: actions/checkout@v4
      - name: Download and cryptographically verify Night City example
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 3 \
            "https://tmpfiles.org/wUAVWhmAohmq/night_city_2077_skill_package.zip" \
            --output /tmp/download-page.html
          python3 - <<'PY' > /tmp/download-url.txt
          from pathlib import Path
          from html import unescape
          import re
          html = Path("/tmp/download-page.html").read_text()
          found = re.search(r'class="download" href="([^"]+)"', html)
          if not found:
              raise RuntimeError("Could not retrieve the signed package download URL")
          print(unescape(found.group(1)))
          PY
          curl --fail --location --retry 3 --retry-delay 3 \
            "$(cat /tmp/download-url.txt)" --output /tmp/night-city.zip
          echo "10cc8cf1db2345a22b143d5b4064539a917ac0be5214822a0f3dc39959815a87  /tmp/night-city.zip" | sha256sum --check
          unzip -q /tmp/night-city.zip -d /tmp/night-city-import
          test -s /tmp/night-city-import/night-city-2077/scene.html
          test -s /tmp/night-city-import/night-city-2077/night_city_2077.mp4
          test -s /tmp/night-city-import/night-city-2077/preview.gif
          mkdir -p scenes/night-city-2077
          rsync -a /tmp/night-city-import/night-city-2077/ scenes/night-city-2077/
      - name: Commit 3D source, video, soundtrack and preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scenes/night-city-2077
          if ! git diff --cached --quiet; then
            git commit -m "feat: add Night City 2077 perspective illusion film and source [skip ci]"
            git push
          fi
